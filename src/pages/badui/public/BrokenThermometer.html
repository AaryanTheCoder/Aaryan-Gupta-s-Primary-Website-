<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/badui/">
    <title>Broken Thermometer</title>
    <link rel="stylesheet" href="thermometer.css">
</head>
<body>
    <h1>Broken Thermometer That Still Works!</h1>
    <label for="direction">Convert:</label>
    <select id="direction">
        <option value="fahrenheit">Fahrenheit to Celsius</option>
        <option value="celsius">Celsius to Fahrenheit</option>
    </select>
    <p><button id="generateButton" type="button" onclick="generateTemperature()">Generate random temperature</button></p>
    <p id="temperature" role="status">No temperature generated yet.</p>
    <p><button id="convertButton" type="button" hidden onmouseenter="teleportButton(this)"
        onclick="convertTemperature()">Convert</button></p>
    <p id="notice" role="status"></p>
    <p id="temperatureResult" role="status"></p>

    <dialog id="captcha" aria-labelledby="captchaTitle">
        <h2 id="captchaTitle">DO COMPSCI PUSHUPS</h2>
        <div class="camera">
            <video id="webcam" autoplay muted playsinline></video>
            <canvas id="poseOverlay" width="640" height="480" aria-hidden="true"></canvas>
        </div>
        <p id="pushupCount" role="status">0 / 6</p>
        <button id="enableCamera" type="button">Enable camera</button>
        <button id="cancelCaptcha" type="button">Cancel</button>
    </dialog>

    <dialog id="shooterChallenge" aria-labelledby="shooterTitle">
        <h2 id="shooterTitle">Peter has stolen the thermometer get him!</h2>
        <iframe id="shooterFrame" title="Square Shooter AI challenge" src="about:blank"></iframe>
        <button id="cancelShooter" type="button">Cancel</button>
    </dialog>

    <dialog id="repairChallenge" aria-labelledby="repairTitle">
        <div id="repairHeader">
            <h2 id="repairTitle">Calculating temperature…</h2>
            <p id="repairStatus" role="status"></p>
            <p id="repairAnswer" role="status"></p>
            <button id="cancelRepair" type="button">Cancel</button>
        </div>
        <div id="repairScene" class="repair-scene">
            <div class="progress-label"><span>Temperature calculation</span><span id="progressPercent">0%</span></div>
            <div id="progressTrack" class="progress-track" role="progressbar" aria-label="Calculating temperature"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progressFill" class="progress-fill"></div>
                <button id="progressHole" class="progress-hole" type="button" hidden aria-label="Hole in the progress bar"></button>
                <div class="leak-stream" aria-hidden="true"></div>
            </div>
            <div class="spill-puddle" aria-hidden="true"></div>
            <div id="puzzleObjects" class="puzzle-objects"></div>
        </div>
    </dialog>

    <script src="pushup-counter.js"></script>
    <script src="repair-puzzle.js"></script>
    <script src="BrokenThermometer.js"></script>
</body>
</html>
